<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Contoh website company profile multi-halaman dengan navigasi konsisten">
  <rect width="800" height="600" fill="#F5F0E8"/>
  <!-- browser -->
  <rect x="90" y="70" width="620" height="460" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14"/>
  <line x1="90" y1="150" x2="710" y2="150" stroke="#1A1A1A" stroke-width="10"/>
  <circle cx="130" cy="110" r="10" fill="#1A1A1A"/>
  <circle cx="162" cy="110" r="10" fill="#1A1A1A"/>
  <circle cx="194" cy="110" r="10" fill="#1A1A1A"/>
  <!-- nav menu 5 halaman -->
  <g fill="#1A1A1A">
    <rect x="250" y="104" width="50" height="12" rx="6"/>
    <rect x="330" y="104" width="50" height="12" rx="6"/>
    <rect x="410" y="104" width="50" height="12" rx="6"/>
    <rect x="490" y="104" width="50" height="12" rx="6"/>
  </g>
  <rect x="570" y="94" width="90" height="30" rx="999" fill="#FFD23F" stroke="#1A1A1A" stroke-width="6"/>
  <!-- hero -->
  <rect x="130" y="190" width="300" height="120" rx="12" fill="#FFD23F" stroke="#1A1A1A" stroke-width="8"/>
  <rect x="155" y="215" width="180" height="18" rx="9" fill="#1A1A1A"/>
  <rect x="155" y="243" width="240" height="10" rx="5" fill="#1A1A1A"/>
  <rect x="155" y="262" width="200" height="10" rx="5" fill="#1A1A1A"/>
  <!-- ilustrasi tim/office -->
  <rect x="480" y="190" width="180" height="120" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8"/>
  <g fill="#FF6B35" stroke="#1A1A1A" stroke-width="6">
    <circle cx="540" cy="240" r="20"/>
    <circle cx="600" cy="240" r="20"/>
  </g>
  <rect x="510" y="270" width="120" height="10" rx="5" fill="#1A1A1A"/>
  <!-- layanan grid 3 kolom -->
  <g stroke="#1A1A1A" stroke-width="8" fill="#FFFFFF">
    <rect x="130" y="350" width="160" height="140" rx="10"/>
    <rect x="320" y="350" width="160" height="140" rx="10"/>
    <rect x="510" y="350" width="160" height="140" rx="10"/>
  </g>
  <g fill="#FFD23F" stroke="#1A1A1A" stroke-width="6">
    <rect x="160" y="375" width="40" height="40" rx="10"/>
    <rect x="350" y="375" width="40" height="40" rx="10"/>
    <rect x="540" y="375" width="40" height="40" rx="10"/>
  </g>
  <g fill="#1A1A1A">
    <rect x="150" y="435" width="110" height="10" rx="5"/>
    <rect x="340" y="435" width="110" height="10" rx="5"/>
    <rect x="530" y="435" width="110" height="10" rx="5"/>
    <rect x="150" y="455" width="90" height="8" rx="4"/>
    <rect x="340" y="455" width="90" height="8" rx="4"/>
    <rect x="530" y="455" width="90" height="8" rx="4"/>
  </g>
</svg>
