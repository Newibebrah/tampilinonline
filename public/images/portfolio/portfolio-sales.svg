  </g>
  <g fill="#FF6B35">
    <circle cx="332" cy="357" r="7"/>
    <circle cx="332" cy="383" r="7"/>
    <circle cx="332" cy="409" r="7"/>
  </g>
  <!-- CTA WA menonjol -->
  <rect x="326" y="440" width="148" height="48" rx="999" fill="#FFD23F" stroke="#1A1A1A" stroke-width="8"/>
  <!-- dekorasi -->
  <rect x="120" y="120" width="120" height="90" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="10"/>
  <circle cx="170" cy="165" r="24" fill="#FFD23F" stroke="#1A1A1A" stroke-width="8"/>
  <circle cx="660" cy="420" r="50" fill="#FF6B35" stroke="#1A1A1A" stroke-width="10"/>
  <rect x="580" y="120" width="110" height="70" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="10"/>
