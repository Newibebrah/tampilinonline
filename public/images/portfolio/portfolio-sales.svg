<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Contoh landing page sales dengan headline tegas dan tombol WhatsApp">
  <rect width="800" height="600" fill="#F5F0E8"/>
