  <rect x="300" y="40" width="200" height="520" rx="36" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14"/>
  <!-- headline besar -->
  <rect x="326" y="100" width="148" height="22" rx="11" fill="#1A1A1A"/>
  <rect x="326" y="134" width="120" height="22" rx="11" fill="#1A1A1A"/>
  <rect x="326" y="168" width="100" height="10" rx="5" fill="#1A1A1A"/>
  <rect x="326" y="186" width="130" height="10" rx="5" fill="#1A1A1A"/>
  <!-- gambar produk -->
  <rect x="326" y="220" width="148" height="110" rx="10" fill="#FFD23F" stroke="#1A1A1A" stroke-width="8"/>
  <rect x="380" y="250" width="60" height="44" rx="8" fill="#FF6B35" stroke="#1A1A1A" stroke-width="6"/>
  <!-- list manfaat -->
  <g fill="#1A1A1A">
    <rect x="326" y="352" width="140" height="10" rx="5"/>
    <rect x="326" y="378" width="120" height="10" rx="5"/>
