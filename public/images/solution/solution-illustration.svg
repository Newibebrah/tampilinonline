<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi website sebagai pusat digital bisnis yang terhubung dengan berbagai kanal">
  <rect width="800" height="600" fill="#F5F0E8"/>
  <circle cx="400" cy="300" r="270" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="0"/>
  <g stroke="#1A1A1A" stroke-width="10">
    <!-- garis koneksi dari pusat ke node -->
    <line x1="400" y1="300" x2="130" y2="120" stroke-width="8"/>
    <line x1="400" y1="300" x2="670" y2="120" stroke-width="8"/>
    <line x1="400" y1="300" x2="130" y2="480" stroke-width="8"/>
    <line x1="400" y1="300" x2="670" y2="480" stroke-width="8"/>

    <!-- browser pusat -->
    <rect x="290" y="210" width="220" height="180" rx="16" fill="#FFFFFF"/>
    <line x1="290" y1="250" x2="510" y2="250"/>
    <rect x="305" y="222" width="12" height="12" rx="6" fill="#1A1A1A"/>
    <rect x="325" y="222" width="12" height="12" rx="6" fill="#1A1A1A"/>
    <rect x="345" y="222" width="12" height="12" rx="6" fill="#1A1A1A"/>
    <rect x="310" y="270" width="120" height="26" rx="6" fill="#1A1A1A"/>
    <rect x="310" y="308" width="180" height="14" rx="6" fill="#1A1A1A"/>
    <rect x="310" y="332" width="140" height="14" rx="6" fill="#1A1A1A"/>

    <!-- node: toko -->
    <rect x="85" y="70" width="90" height="90" rx="16" fill="#FFD23F"/>
    <path d="M105 100 h50 l-6 40 h-38 z" fill="#F5F0E8"/>
    <rect x="100" y="88" width="60" height="12" rx="6" fill="#1A1A1A"/>

    <!-- node: megaphone -->
    <rect x="625" y="70" width="90" height="90" rx="16" fill="#FF6B35"/>
    <path d="M645 100 l30 -12 v46 l-30 -12 z" fill="#F5F0E8"/>
    <rect x="641" y="112" width="10" height="26" rx="5" fill="#F5F0E8"/>

    <!-- node: chat -->
    <rect x="85" y="430" width="90" height="90" rx="16" fill="#FFD23F"/>
    <path d="M105 455 h60 a10 10 0 0 1 10 10 v22 a10 10 0 0 1 -10 10 h-30 l-16 14 v-14 h-14 a10 10 0 0 1 -10 -10 v-22 a10 10 0 0 1 10 -10 z" fill="#F5F0E8"/>

    <!-- node: keranjang -->
    <rect x="625" y="430" width="90" height="90" rx="16" fill="#FF6B35"/>
    <path d="M645 452 h10 l10 34 h32 l10 -26 h-48" fill="#F5F0E8" stroke="#1A1A1A" stroke-width="6"/>
    <circle cx="665" cy="498" r="4" fill="#1A1A1A"/>
    <circle cx="690" cy="498" r="4" fill="#1A1A1A"/>
  </g>
</svg>
